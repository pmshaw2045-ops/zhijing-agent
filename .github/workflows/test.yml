name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -e .

      - name: Lint with ruff
        run: ruff check backend/

      - name: Run tests with coverage
        run: pytest --cov=backend --cov-report=term-missing tests/ -v --tb=short -m "not integration"

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: zhijing:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify imports
        run: docker run --rm zhijing:ci-test python3 -c "from backend.config import diagnostics; d=diagnostics(); print(f'OK env={d[\"env\"]}'); from backend.server import app; print('server OK'); from backend.agent_engine import AgentEngine; AgentEngine(); print('engine OK')"
