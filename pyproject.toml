[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zhijing-agent"
version = "2.0.0"
description = "织镜 ZHÌJÌNG 服饰电商AI Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.47.0",
    "openai==2.32.0",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[tool.ruff]
target-version = "py311"

lint.ignore = [
    "F401",
    "F841",
    "E501",
    "E722",
]

[lint.per-file-ignores]
"tests/*" = ["F401", "F841", "E501", "S101"]
"backend/harness/*" = ["F401"]
"backend/decompose_engine.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-v --tb=short -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: marks tests that call real LLM APIs (skipped without DEEPSEEK_API_KEY)",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/startup_diag.py"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "except ImportError:",
    "pragma: no cover",
]
show_missing = true
