services:
  zhijing:
    build: .
    container_name: zhijing
    restart: unless-stopped
    ports:
      - "8899:8899"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
